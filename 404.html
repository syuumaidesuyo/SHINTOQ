<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SHINTOQ | ページが見つかりません</title>
  <style>
    :root {
      --paper: #f3f2eb;
      --ink: #1b2924;
      --green: #315b45;
      --lime: #d5e36e;
      --muted: #68716a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--paper);
      color: var(--ink);
      font-family: "Noto Sans JP", sans-serif;
    }
    .card {
      width: min(560px, calc(100% - 32px));
      text-align: center;
      padding: 48px 30px;
      background: rgba(255,255,255,0.5);
      border: 1px solid rgba(49, 91, 69, 0.14);
      border-radius: 18px;
    }
    .eyebrow {
      margin: 0 0 14px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.18em;
      color: var(--green);
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-size: clamp(38px, 7vw, 72px);
      line-height: 1.1;
      letter-spacing: -0.06em;
    }
    p {
      margin: 18px auto 0;
      max-width: 440px;
      font-size: 14px;
      line-height: 2;
      color: var(--muted);
    }
    .link {
      display: inline-block;
      margin-top: 26px;
      padding: 12px 22px;
      border-radius: 999px;
      background: var(--green);
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      transition: transform 0.2s ease;
    }
    .link:hover {
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <main class="card">
    <p class="eyebrow">404 error</p>
    <h1>Page Not Found</h1>
    <p>お探しのページは移動または削除された可能性があります。<br>下のリンクからSHINTOQのトップページへ戻れます。</p>
    <a class="link" href="./index.html">ホームへ戻る</a>
  </main>
</body>
</html>
